  <text class="h" x="60" y="830">Sábado 18</text><text class="m" x="60" y="868">2 elementos</text>
  <g transform="translate(60 910)"><text class="t" x="0" y="30">18:30</text><text class="t" x="150" y="30">Cena familiar</text><text class="m" x="150" y="66">1 h 30 · Casa</text><line class="line" x1="0" y1="98" x2="960" y2="98"/><circle cx="26" cy="156" r="20" fill="#fff" stroke="#C17F59" stroke-width="3"/><text class="t" x="76" y="164">Comprar medicación</text><text class="m" x="76" y="198">Hoy · Gabriel</text></g>
  <text class="b" x="60" y="1210">Month orienta; la agenda explica. Nunca comprimir los números del mes para alojar metadata.</text>
</svg>
