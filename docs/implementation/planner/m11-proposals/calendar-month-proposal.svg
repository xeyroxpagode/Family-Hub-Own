    <g class="accent"><circle cx="340" cy="92" r="5"/><circle cx="474" cy="192" r="5"/><circle cx="608" cy="192" r="5"/><circle cx="742" cy="292" r="5"/><circle cx="754" cy="292" r="5"/><circle cx="206" cy="392" r="5"/></g>
