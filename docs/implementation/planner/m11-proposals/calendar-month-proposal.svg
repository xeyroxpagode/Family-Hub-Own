      <text x="60" y="270">13</text><text x="194" y="270">14</text><text x="328" y="270">15</text><text x="462" y="270">16</text><text x="596" y="270">17</text><circle class="accent" cx="736" cy="262" r="28"/><text x="724" y="270" fill="#fff">18</text><text x="856" y="270">19</text>
      <text x="52" y="370">20</text><text x="186" y="370">21</text><text x="320" y="370">22</text><text x="454" y="370">23</text><text x="588" y="370">24</text><text x="722" y="370">25</text><text x="856" y="370">26</text>
