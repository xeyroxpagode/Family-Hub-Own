<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1260" viewBox="0 0 1080 1260" role="img" aria-labelledby="title desc">
  <title id="title">Planner Calendar Month</title><desc id="desc">Propuesta de mes legible con puntos de densidad y agenda del día seleccionado.</desc>
  <defs><style>.bg{fill:#FBFAF8}.card{fill:#fff;stroke:#E5DDD7;stroke-width:2}.h{font:700 34px system-ui,sans-serif;fill:#2C2623}.t{font:700 24px system-ui,sans-serif;fill:#2C2623}.b{font:500 21px system-ui,sans-serif;fill:#5F5752}.m{font:500 18px system-ui,sans-serif;fill:#746A64}.d{font:600 20px system-ui,sans-serif;fill:#4F4844}.muted{fill:#B7AEA8}.accent{fill:#C17F59}.line{stroke:#E7E0DB;stroke-width:2}</style></defs>
  <rect class="bg" width="1080" height="1260"/><text class="h" x="60" y="70">Julio 2026</text><text class="t" x="820" y="68">Hoy</text><text class="t" x="940" y="68">‹  ›</text>
  <rect class="card" x="48" y="110" width="984" height="650" rx="28"/>
