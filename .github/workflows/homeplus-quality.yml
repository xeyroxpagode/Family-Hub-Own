name: HomePlus Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeplus-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, contract, and local DB quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            front/mi-front-limpio/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix front/mi-front-limpio
      - name: Start isolated local Supabase
        run: supabase start
      - name: Run official quality gate
        run: npm run quality
        env:
          HOMEPLUS_TEST_REQUIRE_LOCAL_DB: '1'
      # STAGE 2 REOPEN -- the Stage 2 integration gate, named EXPLICITLY.
      #
      # `npm run quality` already reaches it through `homecloud-files`, but an
      # integration gate that only exists transitively inside another gate is invisible:
      # nobody can tell from the CI file whether the cross-flows, the large-data
      # boundaries, the household-isolation matrix and the privacy review actually
      # executed, and a future edit to that aggregate could quietly drop them.
      #
      # This job provisions the canonical local Supabase above, so the suite RUNS here.
      # It is deliberately NOT a job that skips itself when the stack is missing: the
      # stack is started three steps earlier in the same job, so a skip here would mean
      # the environment is broken, not that the check is optional.
      - name: Run HomeCloud Files Stage 2 integration QA
        run: node tests/run.js homecloud-stage2-integrated
      - name: Run the canonical HomeCloud Files Stage 2 gate
        run: node tests/run.js homecloud-files-stage2

  integration:
    name: Local runtime integration
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            front/mi-front-limpio/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix front/mi-front-limpio
      - run: supabase start
      - name: Run isolated runtime suites
        run: npm run test:integration
